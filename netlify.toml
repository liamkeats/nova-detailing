[build]
  command = "astro build"
  publish = "dist"
  functions = "src/netlify/functions"

[dev]
  command = "astro dev"
  targetPort = 4321
  port = 8888
  publish = "dist"
  framework = "#custom"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/crm-sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/crm"

[[headers]]
  for = "/crm/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
    Content-Type = "application/manifest+json; charset=UTF-8"

[[headers]]
  for = "/assets/crm/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
